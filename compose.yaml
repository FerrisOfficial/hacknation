# Cały stos on-premise jedną komendą (wymaganie UKNF, docs/ZADANIE.md):
#
#   cp .env.example .env
#   docker compose up --build
#
# Aplikacja: http://localhost:3000/hacknation, API ML: http://127.0.0.1:8000/docs
# Z kartą NVIDIA dla Ollamy: docker compose -f compose.yaml -f compose.gpu.yaml up --build
#
# Baza `db` to jedyna baza projektu (lokalny Postgres, bez chmury). Migracje stosuje na niej
# `migrate`. Ta sama baza służy do developmentu: `pnpm db:up` uruchamia ją samą (port 5432 na
# 127.0.0.1) i nakłada migracje, a `pnpm dev` łączy się z nią z hosta.

name: hacknation

x-database-url: &database-url "postgres://hacknation:${POSTGRES_PASSWORD:?Brak .env - skopiuj .env.example do .env}@db:5432/hacknation"

services:
  db:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_USER: hacknation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Brak .env - skopiuj .env.example do .env}
      POSTGRES_DB: hacknation
      # Pierwszy start zakłada bazę i restartuje Postgresa. Przy zapchanym dysku (równoległe
      # rozpakowywanie obrazów i pobieranie modelu) zamknięcie trwa ponad domyślne 60 s pg_ctl.
      PGCTLTIMEOUT: "300"
    volumes:
      - db-data:/var/lib/postgresql/data
    # Tylko z tego komputera — dla `pnpm dev` i `pnpm db:*` (DATABASE_URL w .env.example).
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      # Po TCP, nie przez gniazdo: tymczasowy serwer z inicjalizacji słucha tylko na gnieździe,
      # więc healthcheck nie zgłosi gotowości, zanim baza naprawdę wstanie.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U hacknation -d hacknation"]
      interval: 2s
      timeout: 5s
      retries: 15
      # Pierwsza inicjalizacja może trwać kilka minut — w tym czasie porażki się nie liczą.
      start_period: 5m
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  ml:
    build: services/ml
    environment:
      # Ollama na hoście zamiast w kontenerze (np. Mac z GPU Apple): http://host.docker.internal:11434
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e2b}
      # Moduł 2: rules (regex, bez LLM), hybrid (regex + LLM — zalecany), llm (sam LLM).
      M2_ENGINE: ${M2_ENGINE:-rules}
      OLLAMA_RISK_MODEL: ${OLLAMA_RISK_MODEL:-hf.co/speakleash/Bielik-PL-11B-v3.0-Instruct-GGUF:Q8_0}
      SCRAPER_PROXY_URL: ${SCRAPER_PROXY_URL:-}
      YOUTUBE_DELAY_S: ${YOUTUBE_DELAY_S:-3}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
    environment:
      DATABASE_URL: *database-url
      ML_API_URL: http://ml:8000
      COLLECTOR_TOKEN: ${COLLECTOR_TOKEN:-}
      # Socket.io (powiadomienia w czasie rzeczywistym) na osobnym porcie — patrz src/lib/realtime.
      REALTIME_PORT: "3001"
      REALTIME_HOST: 0.0.0.0
      REALTIME_CORS_ORIGIN: ${REALTIME_CORS_ORIGIN:-http://localhost:3000,http://127.0.0.1:3000}
      # Baza treści (surowy HTML materiałów, gzip, adresowany SHA-256) na wolumenie.
      CONTENT_STORE_DIR: /data/content
      SCRAPE_CONCURRENCY: ${SCRAPE_CONCURRENCY:-2}
      ANALYZE_CONCURRENCY: ${ANALYZE_CONCURRENCY:-1}
      MATERIALS_LIMIT: ${MATERIALS_LIMIT:-2000}
      SCHEDULER_BATCH: ${SCHEDULER_BATCH:-1}
    volumes:
      - content-store:/data/content
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      ml:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/hacknation/api/health?db=1').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Lokalny silnik LLM (open source, bez zewnętrznych API).
  ollama:
    image: ollama/ollama:0.40.17
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Jednorazowo pobiera modele do wolumenu `ollama-models` (pierwszy start: kilka GB).
  # Model Modułu 2 tylko przy M2_ENGINE innym niż `rules` (Bielik APT4 Q8_0: ok. 12 GB).
  ollama-pull:
    image: ollama/ollama:0.40.17
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e2b}
      M2_ENGINE: ${M2_ENGINE:-rules}
      OLLAMA_RISK_MODEL: ${OLLAMA_RISK_MODEL:-hf.co/speakleash/Bielik-PL-11B-v3.0-Instruct-GGUF:Q8_0}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        ollama pull "$$OLLAMA_MODEL" &&
        { [ "$$M2_ENGINE" = rules ] || ollama pull "$$OLLAMA_RISK_MODEL"; }
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  db-data:
  ollama-models:
  content-store:
