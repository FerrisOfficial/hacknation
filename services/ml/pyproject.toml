[project]
name = "ml"
version = "0.1.0"
description = "Serwis ML (FastAPI)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.7",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "selectolax>=1.0.2",
    "youtube-transcript-api>=1.2.5",
    "yt-dlp>=2026.10.26",
]

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E/F: błędy, I: sortowanie importów, UP: nowoczesna składnia, B: typowe bugi, SIM: uproszczenia
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
