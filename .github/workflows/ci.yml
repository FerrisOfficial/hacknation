name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typy, testy, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      # setup-uv nie publikuje tagów głównych (v10) — tylko pełne wersje.
      - uses: astral-sh/setup-uv@v10.3.3

      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked
        working-directory: services/ml

      # Dokładnie to samo, co `pnpm check` lokalnie (TS + Python).
      - run: pnpm check

      # Ten sam build, który idzie na Cloudflare (next build + OpenNext). Lokalnie na Windowsie
      # OpenNext nie działa (symlinki), więc to jedyne miejsce, gdzie sprawdzamy go przed merge'em.
      - name: Build (Next.js na Cloudflare)
        run: pnpm --filter @app/web cf:build
        # Te same publiczne wartości co w deploy.yml, żeby testować dokładnie to, co idzie na produkcję.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://gzttmqjlvcjfwtwpgcrc.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_I3GI6XCNEu_sZn43yXkHOg_QsKrPfUk

      - name: Rozmiar Workera (plan Free — maks. 3 MiB po kompresji)
        working-directory: apps/web
        run: |
          set -o pipefail
          pnpm exec wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker" | tee "$RUNNER_TEMP/dry-run.log"
          kib=$(grep -oE 'gzip: [0-9.]+ KiB' "$RUNNER_TEMP/dry-run.log" | grep -oE '[0-9.]+' | tail -1)
          if [ -z "$kib" ]; then
            echo "::warning::Nie odczytałem rozmiaru Workera z wranglera."
          elif awk -v k="$kib" 'BEGIN { exit !(k > 3072) }'; then
            echo "::error::Worker ma ${kib} KiB po kompresji, a plan Free Cloudflare pozwala na 3072 KiB. Odchudź zależności albo przejdźcie na Workers Paid (10 MiB)."
            exit 1
          else
            echo "Worker: ${kib} KiB po kompresji (limit planu Free: 3072 KiB)."
          fi

      # Uruchamia zbudowanego Workera w workerd (ten sam runtime co Cloudflare) i sprawdza, czy strony
      # się renderują. Sam build tego nie łapie — błąd wychodzi dopiero przy pierwszym żądaniu.
      - name: Worker odpowiada (wrangler dev)
        working-directory: apps/web
        run: |
          log="$RUNNER_TEMP/wrangler-dev.log"
          pnpm exec wrangler dev --ip 127.0.0.1 --port 8787 > "$log" 2>&1 &
          base=http://127.0.0.1:8787/hacknation
          for _ in $(seq 1 45); do
            curl -s -o /dev/null "$base/api/health" && break
            sleep 2
          done
          fail=0
          check() {
            code=$(curl -s -o "$RUNNER_TEMP/body" -w '%{http_code}' "$1" || true)
            echo "$1 -> $code"
            if [ "$code" != "200" ]; then
              fail=1
              echo "::error::Worker zwrócił $code na $1 (na Cloudflare to zwykle błąd 1101)."
              head -c 1000 "$RUNNER_TEMP/body"; echo
            fi
          }
          check "$base"
          # CSS ze strony głównej — sprawdza, że pliki z _next idą spod /hacknation.
          css=$(grep -oE '/hacknation/_next/static/[^"]+\.css' "$RUNNER_TEMP/body" | head -1)
          if [ -n "$css" ]; then check "http://127.0.0.1:8787$css"; else fail=1; echo "::error::Na stronie nie ma CSS spod /hacknation/_next."; fi
          check "$base/api/health"
          kill %1 2>/dev/null || true
          if [ "$fail" = 1 ]; then echo "--- log wranglera ---"; cat "$log"; exit 1; fi

      - name: Kontrakt API (typy TS zgodne z FastAPI)
        run: |
          pnpm api:generate
          git diff --exit-code -- packages/api-ml || {
            echo "::error::Typy klienta ML są nieaktualne. Uruchom 'pnpm api:generate' i scommituj zmiany."
            exit 1
          }

  docker:
    name: Docker Compose (cały stos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env

      # Bez Ollamy: jej obraz i model to kilka GB, a web i ml jeszcze z niej nie korzystają.
      - name: Zbuduj i uruchom (db, migrate, ml, web)
        run: docker compose up --build --detach web

      - name: Stos odpowiada
        run: |
          base=http://127.0.0.1:3000/hacknation
          for _ in $(seq 1 60); do
            curl -fs -o /dev/null "$base/api/health?db=1" && break
            sleep 2
          done
          fail=0
          check() {
            echo "$1 -> $2"
            if [ "$2" != "200" ]; then fail=1; echo "::error::$1 zwróciło $2"; fi
          }
          check "GET /api/health?db=1" "$(curl -s -o /dev/null -w '%{http_code}' "$base/api/health?db=1")"
          check "GET /" "$(curl -s -o /dev/null -w '%{http_code}' "$base")"
          # Przez Next.js do FastAPI — sprawdza sieć między kontenerami.
          check "POST /api/predict" "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"text":"Bardzo dobry produkt"}' "$base/api/predict")"
          exit "$fail"

      - name: Logi kontenerów
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color

  e2e:
    name: Testy e2e (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @app/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
